# Listen on localhost only: the stock unit binds 0.0.0.0, which leaves the
# lighting controllable from the whole LAN. Runs as root so the NVMe LEDs
# (XPG Spectrix) are reachable; rgb-sync.sh connects to it as a client.
[Service]
ExecStart=
ExecStart=/usr/bin/openrgb --server --server-host 127.0.0.1 --config /etc/openrgb
